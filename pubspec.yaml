name: lupus_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  # sdk: ^3.7.2
  sdk: ^3.6.1

dependencies:
  country_flags: ^3.2.0
  cupertino_icons: ^1.0.8
  dots_indicator: ^4.0.1
  flutter:
    sdk: flutter
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Changa
      fonts:
        - asset: assets/fonts/Changa-ExtraLight.ttf
          weight: 100
        - asset: assets/fonts/Changa-Light.ttf
          weight: 300
        - asset: assets/fonts/Changa-Regular.ttf
          weight: 400
        - asset: assets/fonts/Changa-Medium.ttf
          weight: 500
        - asset: assets/fonts/Changa-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Changa-Bold.ttf
          weight: 700
        - asset: assets/fonts/Changa-ExtraBold.ttf
          weight: 800
